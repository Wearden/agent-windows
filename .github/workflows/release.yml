# Publishes the windows agent binary and its checksum. Run it by pushing a version tag, for example: git tag v1.0.0 && git push origin v1.0.0
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-windows
      - uses: actions/checkout@v4
        with:
          repository: Wearden/proto
          path: proto
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: |
          go work init ./proto ./agent-windows
          go work edit -replace=github.com/Wearden/proto@v0.0.0=./proto
          go work sync
          mkdir release
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o release/wearden-agent-windows-amd64.exe ./agent-windows/cmd/agent
          (cd release && sha256sum wearden-agent-windows-amd64.exe > SHA256SUMS)
      - name: Store the release files
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
